<!doctype html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Diskretna empirijska interpolacijska metoda</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        #deck {
            position: absolute;
            inset: 0;
            margin: auto;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: white;
            box-shadow: 0 0 40px rgb(0 0 0 / 45%);
        }

        @supports (height: 100dvh) {
            #deck {
                width: min(100vw, calc(100dvh * 16 / 9));
                height: min(100dvh, calc(100vw * 9 / 16));
            }
        }

        .slide {
            position: absolute;
            inset: 0;
            display: none;
        }

        .slide.active {
            display: block;
        }

        .slide-image {
            display: block;
            width: 100%;
            height: 100%;
        }

        .animation-overlay {
            position: absolute;
            left: 18%;
            top: 13%;
            width: 64%;
            height: 74.283%;
            object-fit: fill;
            background: white;
            cursor: pointer;
        }

        .full-video-overlay {
            position: absolute;
            left: 9.3%;
            top: 23.7%;
            width: 81.4%;
            height: 51.7%;
            object-fit: contain;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main id="deck" aria-label="Prezentacija"></main>

    <script>
        const pageCount = 15;
        const videoSlide = 3 - 1;
        const finalVideoSlide = 15 - 1;
        const fullVideoSlide = 2 - 1;
        const assetVersion = "20260916152207";
        const assetUrl = (path) => `${path}?v=${assetVersion}`;
        const deck = document.getElementById("deck");
        const slides = [];
        const slideAnimations = new Map();
        let animation = null;
        let fullVideo = null;

        async function refreshIfOutdated() {
            try {
                const response = await fetch(
                    `build-id.txt?check=${Date.now()}`,
                    { cache: "no-store" },
                );
                if (!response.ok) return;
                const currentBuild = (await response.text()).trim();
                if (!currentBuild || currentBuild === assetVersion) return;

                const freshUrl = new URL(window.location.href);
                freshUrl.searchParams.set("v", currentBuild);
                window.location.replace(freshUrl.toString());
            } catch {
                // Local file presentations do not need a server-side update check.
            }
        }

        window.addEventListener("pageshow", refreshIfOutdated);

        for (let index = 0; index < pageCount; index += 1) {
            const slide = document.createElement("section");
            slide.className = "slide";

            const pageNumber = String(index + 1).padStart(4, "0");
            const image = document.createElement("img");
            image.className = "slide-image";
            image.src = assetUrl(`slides/slide-${pageNumber}.png`);
            image.alt = `Slajd ${index + 1}`;
            slide.appendChild(image);

            if (index === fullVideoSlide) {
                const video = document.createElement("video");
                video.className = "full-video-overlay";
                video.src = assetUrl("media/navier_stokes_full_30s.webm");
                video.poster = assetUrl("media/navier_stokes_full_30s_poster.png");
                video.preload = "metadata";
                video.playsInline = true;
                video.muted = true;
                video.loop = true;
                video.setAttribute("aria-label", "Puna simulacija strujanja iza valjka do vremena 30");
                video.addEventListener("click", (event) => {
                    event.stopPropagation();
                    toggleFullVideo();
                });
                slide.appendChild(video);
                fullVideo = video;
            }

            if (index === videoSlide || index === finalVideoSlide) {
                const comparisonVideo = document.createElement("video");
                comparisonVideo.className = "animation-overlay";
                comparisonVideo.src = assetUrl("media/navier_stokes_threeway_comparison.mp4");
                comparisonVideo.poster = assetUrl("media/navier_stokes_threeway_poster.png");
                comparisonVideo.preload = "metadata";
                comparisonVideo.playsInline = true;
                comparisonVideo.muted = true;
                comparisonVideo.loop = true;
                comparisonVideo.setAttribute("aria-label", "Sinkronizirana usporedba punog modela i DEIM rekonstrukcija sa 60 i 20 senzora");
                comparisonVideo.addEventListener("click", (event) => {
                    event.stopPropagation();
                    toggleAnimation();
                });
                slide.appendChild(comparisonVideo);
                slideAnimations.set(index, comparisonVideo);
            }

            deck.appendChild(slide);
            slides.push(slide);
        }

        let current = Math.max(
            0,
            Math.min(pageCount - 1, Number(location.hash.slice(1)) - 1 || 0),
        );

        function toggleAnimation() {
            if (!animation || !slideAnimations.has(current)) return;
            if (animation.paused) {
                if (animation.ended) animation.currentTime = 0;
                animation.play().catch(() => {});
            } else {
                animation.pause();
            }
        }

        function toggleFullVideo() {
            if (!fullVideo || current !== fullVideoSlide) return;
            if (fullVideo.paused) {
                if (fullVideo.ended) fullVideo.currentTime = 0;
                fullVideo.play().catch(() => {});
            } else {
                fullVideo.pause();
            }
        }

        function resetAnimation() {
            if (!animation) return;
            animation.pause();
            animation.currentTime = 0;
        }

        function showSlide(index) {
            const next = Math.max(0, Math.min(pageCount - 1, index));
            if (slideAnimations.has(current) && next !== current) {
                resetAnimation();
            }
            if (current === fullVideoSlide && next !== fullVideoSlide && fullVideo) {
                fullVideo.pause();
                fullVideo.currentTime = 0;
            }

            current = next;
            animation = slideAnimations.get(current) || null;
            slides.forEach((slide, slideIndex) => {
                slide.classList.toggle("active", slideIndex === current);
            });
            history.replaceState(null, "", `#${current + 1}`);

        }

        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        }

        document.addEventListener("click", (event) => {
            if (event.button !== 0 || event.defaultPrevented) return;
            if (event.target.closest(
                ".animation-overlay, video, audio, button, a, input, select, textarea, [contenteditable], [role='button']",
            )) return;
            showSlide(current + 1);
        });

        document.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            showSlide(current - 1);
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "s" || event.key === "S") {
                event.preventDefault();
                showSlide(0);
                return;
            }

            if (["a", "A", "p", "P"].includes(event.key)) {
                event.preventDefault();
                if (current === fullVideoSlide) {
                    toggleFullVideo();
                } else {
                    toggleAnimation();
                }
                return;
            }

            if (event.key === "f" || event.key === "F") {
                toggleFullscreen();
                return;
            }

            if (["ArrowRight", "PageDown", " "].includes(event.key)) {
                event.preventDefault();
                showSlide(current + 1);
            } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
                event.preventDefault();
                showSlide(current - 1);
            } else if (event.key === "Home") {
                showSlide(0);
            } else if (event.key === "End") {
                showSlide(pageCount - 1);
            }
        });

        showSlide(current);
    </script>
</body>
</html>
